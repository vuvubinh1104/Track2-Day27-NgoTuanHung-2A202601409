version: 2

# not_null / unique are data tests: they inspect the materialised relation.
# Unit tests inspect transformation logic with mocked inputs, which is how we
# catch revenue inflation from a many-active-versions customer dimension.

unit_tests:
  - name: completed_orders_sum_to_expected_revenue
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}

  - name: duplicate_active_customer_does_not_inflate_revenue
    description: >
      Two active SCD versions for the same customer must not double-count
      completed revenue. Without DISTINCT on customer_id this test fails
      (completed_order_rows=2, daily_revenue=200).
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true}
          - {customer_id: C0001, is_active: true}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 1, daily_revenue: 100.0}
