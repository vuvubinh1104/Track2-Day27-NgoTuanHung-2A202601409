version: 2

models:
  - name: stg_orders
    description: Cleaned order records used by downstream marts.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: amount_usd
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'VND']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'completed', 'refunded', 'cancelled']
      - name: created_at
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null

  - name: stg_customers
    description: Customer dimension. SCD history may have multiple rows per customer_id.
    columns:
      - name: customer_id
        data_tests:
          - not_null
      - name: is_active
        data_tests:
          - not_null
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: ['VN', 'SG', 'US', 'AU']
              config:
                severity: warn
